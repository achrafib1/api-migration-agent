[project]
name = "atlaspay-client-demo"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.13"
]

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlaspay_client"]
